<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" 
          rel="stylesheet">
    <link href="Inicio.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Raleway&display=swap" rel="stylesheet">
    <title>Inicio</title>
</head>
<body>

<nav class="navbar">
          
    <a href="Inicio.html" class="sesion nav-left">BetGol ⚽</a>
    
<div class="Busqueda">

    <div class="dropdown">

<button class="btn btn-outline-success dropdown-toggle" 
        type="button" 
        id="filtroBtn"
        data-bs-toggle="dropdown">

<span id="filtroTexto">Filtros</span>

</button>

<ul class="dropdown-menu">

<li><button class="dropdown-item" type="button" onclick="aplicarFiltro('')">Todas</button></li>
<li><button class="dropdown-item" type="button" onclick="aplicarFiltro('Hoteles')">Hoteles</button></li>
<li><button class="dropdown-item" type="button" onclick="aplicarFiltro('Restaurantes')">Restaurantes</button></li>
<li><button class="dropdown-item" type="button" onclick="aplicarFiltro('Recreación')">Recreación</button></li>

</ul>

</div>

    <input type="text" id="buscarInput" class="form-control nav-center" placeholder="Ingrese lo que desea buscar aquí" onkeydown="if(event.key==='Enter') buscar()">
    <button class="btn btn-outline-success nav-center" onclick="buscar()">Buscar</button>

</div>
          
<div class="nav-right">
    <div class="user-banner-card" id="userBannerCard">
        <img id="navAvatar" src="perfil.jpg" class="nav-avatar">
        <span id="navNombre">Usuario</span>
    </div>
</div>

</nav>

<hr>

<div class="layout">

    <aside class="sidebar">
    <h2>Servicios en línea:</h2>
    <ul>
      <li><a href="Publi.html">Crear publicación</a></li>
      <li><a href="Chat.html">Chats</a></li>
      <li><a href="Tarea.html">Tareas</a></li>
      <li><a href="Tienda.html">Tienda</a></li>
      <li><a href="Perfil.html">Perfil</a></li>
      <li><a href="Ayuda.html">Ayuda</a></li>
      <hr>
      <li id="li-login"><a href="InicioS.html">Iniciar sesión</a></li>
      <li id="li-logout"><a onclick="logout()" style="cursor:pointer;">Cerrar sesión</a></li>
    </ul>
    </aside>

<main class="contenido" id="feed">
    <p style="color:gray;">Cargando publicaciones...</p>
</main>
  
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>
    const token = localStorage.getItem('token');

    const currentUser = JSON.parse(localStorage.getItem('user') || 'null');

    if (currentUser) {
        document.getElementById('navNombre').textContent = currentUser.full_name;
        if (currentUser.img_profile) {
            document.getElementById('navAvatar').src = currentUser.img_profile;
        }
        //Se agrega el banner
        if (currentUser.banner_url) {
        document.getElementById('userBannerCard').style.backgroundImage = 
            `url('${currentUser.banner_url}')`;
        }
    }

    function authFetch(url, opts = {}) {
        return fetch(url, {
            ...opts,
            headers: { ...(opts.headers || {}), 'Authorization': `Bearer ${token}` }
        });
    }

    function colorCategoria(cat) {
    const colores = {
        'Hoteles':      '#446447',
        'Restaurantes': '#deb887',
        'Recreación':   '#5efea0'
    };
    return colores[cat] || '#72A877'; // verde por default
    }

    /* ── Cargar y renderizar publicaciones ── */
    async function cargarPublicaciones(titulo = '', categoria = '') {
        const feed = document.getElementById('feed');
        feed.innerHTML = '<p style="color:gray;">Cargando publicaciones...</p>';

        const res  = await authFetch('/api/publicaciones');
        let data = await res.json();

        // Filtrar por categoría
        if (categoria) {
            data = data.filter(p => p.categoria === categoria);
        }

        // Filtrar por título (case insensitive)
        if (titulo.trim()) {
            const q = titulo.trim().toLowerCase();
            data = data.filter(p => p.titulo.toLowerCase().includes(q));
        }

        feed.innerHTML = '';

        if (!data.length) {
            feed.innerHTML = '<p style="color:gray;">No se encontraron publicaciones.</p>';
            return;
        }

        data.forEach(p => {
            const postId   = p.id;
            const autorId  = p.users?.id || p.user_id || '';
            const autorNombre = p.users?.full_name || 'Usuario';
            const autorAvatar = p.users?.img_profile || 'perfil.jpg';
            const autorBio    = p.users?.bio || '';
            const autorBanner = p.users?.banner_url || '';

            const div = document.createElement('div');
            div.className = 'post';
            div.dataset.postId = postId;

            div.innerHTML = `
                <div class="post-header" style="
                background: ${autorBanner ? `url('${autorBanner}') center/cover no-repeat` : '#f5f5f5'};
                border-radius: 10px 10px 0 0;
                padding: 12px;
                margin: -20px -20px 10px -20px;
                ">
                    <div class="usuario-wrap">
                    <img src="${autorAvatar}" class="foto-perfil">
                    <span class="usuario" style="color:${autorBanner ? 'white' : 'inherit'}; text-shadow:${autorBanner ? '0 1px 3px rgba(0,0,0,0.6)' : 'none'};">${autorNombre}</span>

                        <div class="user-popover">
                            <img src="${autorAvatar}" class="popover-avatar">
                            <div class="popover-nombre">${autorNombre}</div>
                            <div class="popover-bio">${autorBio}</div>
                            <div class="popover-acciones">
                                <button class="btn-agregar"
                                        onclick="agregarAmigo('${autorId}', '${autorNombre}')">
                                    ➕ Agregar
                                </button>
                                <button class="btn-mensaje"
                                        onclick="irAChat('${autorId}')">
                                    💬 Mensaje
                                </button>
                            </div>
                        </div>
                    </div>
                </div>

                <h4 class="post-titulo">${p.titulo}</h4>
                <span class="categoria" style="background:${colorCategoria(p.categoria)}">${p.categoria}</span>
                <p class="post-texto">${p.datos}</p>
                ${p.media_url ? `<img src="${p.media_url}" class="post-imagen">` : ''}

                <div class="post-actions">
                    <button class="btn-comentarios" onclick="toggleComentarios(this, '${postId}')">
                        💬 <span class="lbl">Ver comentarios</span>
                    </button>
                </div>

                <div class="seccion-comentarios" id="cmt-${postId}">
                    <div class="lista-comentarios" id="lista-${postId}">
                        <p style="font-size:13px;color:#aaa;">Cargando...</p>
                    </div>
                    <div class="input-comentario">
                        <img src="${currentUser?.img_profile || 'perfil.jpg'}"
                             style="width:30px;height:30px;border-radius:50%;object-fit:cover;flex-shrink:0;">
                        <input type="text" placeholder="Escribe un comentario…"
                               id="inp-${postId}"
                               onkeydown="if(event.key==='Enter') enviarComentario('${postId}')">
                        <button onclick="enviarComentario('${postId}')">➤</button>
                    </div>
                </div>
            `;

            feed.appendChild(div);
        });
        initPopovers();
    }

    /* ── Toggle comentarios ── */
    async function toggleComentarios(btn, postId) {
        const seccion = document.getElementById(`cmt-${postId}`);
        const lbl     = btn.querySelector('.lbl');
        const visible = seccion.classList.toggle('visible');

        if (visible) {
            lbl.textContent = 'Ocultar comentarios';
            await cargarComentarios(postId);
        } else {
            lbl.textContent = 'Ver comentarios';
        }
    }

    /* ── Traer comentarios del servidor ── */
    async function cargarComentarios(postId) {
        const lista = document.getElementById(`lista-${postId}`);
        try {
            const res  = await authFetch(`/api/publicaciones/${postId}/comentarios`);
            const data = await res.json();
            renderComentarios(lista, data);
        } catch {
            lista.innerHTML = '<p style="font-size:13px;color:#aaa;">No se pudieron cargar los comentarios.</p>';
        }
    }

    function renderComentarios(lista, data) {
        if (!data.length) {
            lista.innerHTML = '<p style="font-size:13px;color:#aaa;">Sin comentarios aún. ¡Sé el primero!</p>';
            return;
        }
        lista.innerHTML = data.map(c => `
            <div class="comentario-item">
                <img src="${c.users?.img_profile || 'perfil.jpg'}">
                <div class="comentario-burbuja">
                    <strong>${c.users?.full_name || 'Usuario'}</strong>
                    ${c.contenido}
                </div>
            </div>
        `).join('');
    }

    /* ── Enviar comentario ── */
    async function enviarComentario(postId) {
        const inp      = document.getElementById(`inp-${postId}`);
        const contenido = inp.value.trim();
        if (!contenido) return;

        inp.value = '';
        try {
            const res = await authFetch(`/api/publicaciones/${postId}/comentarios`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ contenido })
            });
            if (res.ok) await cargarComentarios(postId);
        } catch {
            alert('Error al enviar comentario');
        }
    }

    /* ── Acciones de usuario (popover) ── */ 
    async function agregarAmigo(userId, nombre) {
        if (!userId) return alert('Usuario no identificado');
        try {
            const res = await authFetch('/api/amigos', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ friend_id: userId })
            });
            if (res.ok) alert(`✅ Solicitud enviada a ${nombre}`);
            else {
                const d = await res.json();
                alert(d.error || 'No se pudo enviar la solicitud');
            }
        } catch {
            alert('Error al enviar solicitud');
        }
    }

    function irAChat(userId) {
        if (!userId) return alert('Usuario no identificado');
        window.location.href = `Chat.html?user=${userId}`;
    }

    function initPopovers() {
    document.querySelectorAll('.usuario-wrap').forEach(wrap => {
        let timer;
        const popover = wrap.querySelector('.user-popover');

        wrap.addEventListener('mouseenter', () => {
            clearTimeout(timer);
            popover.style.display = 'block';
        });

        wrap.addEventListener('mouseleave', () => {
            timer = setTimeout(() => {
                popover.style.display = 'none';
            }, 600); // 600ms de gracia antes de ocultarse
        });

        popover.addEventListener('mouseenter', () => clearTimeout(timer));
        popover.addEventListener('mouseleave', () => {
            timer = setTimeout(() => {
                popover.style.display = 'none';
            }, 600);
        });
    });
}

    cargarPublicaciones();
</script>

<script>
// ── Búsqueda y filtros (scope global) ────────────────────
var categoriaActiva = '';

function buscar() {
    var titulo = document.getElementById('buscarInput').value;
    cargarPublicaciones(titulo, categoriaActiva);
}

function aplicarFiltro(categoria) {
    categoriaActiva = categoria;
    document.getElementById('filtroTexto').textContent = categoria || 'Filtros';
    buscar();
}
</script>


<script>
// ── Sidebar: sesión ───────────────────────────────────────
document.addEventListener('DOMContentLoaded', function() {
    const token = localStorage.getItem('token');
    const liLogin  = document.getElementById('li-login');
    const liLogout = document.getElementById('li-logout');
    if (token) {
        if (liLogin)  liLogin.style.display  = 'none';
        if (liLogout) liLogout.style.display = '';
    } else {
        if (liLogout) liLogout.style.display = 'none';
    }
});

function logout() {
    const token = localStorage.getItem('token');
    if (token) {
        fetch('/api/logout', {
            method: 'POST',
            headers: { 'Authorization': 'Bearer ' + token }
        }).catch(() => {});
    }
    localStorage.clear();
    window.location.href = 'InicioS.html';
}
</script>
</body>
</html>

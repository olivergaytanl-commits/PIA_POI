<script>
    const token = localStorage.getItem('token');

    function authFetch(url, opts = {}) {
        return fetch(url, {
            ...opts,
            headers: { ...(opts.headers || {}), 'Authorization': `Bearer ${token}` }
        });
    }

    function colorCategoria(cat) {
    const colores = {
        'Hoteles':      '#4A90D9',
        'Restaurantes': '#E07B39',
        'Recreación':   '#9B59B6'
    };
    return colores[cat] || '#72A877'; // verde por default
    }

    async function cargarPublicaciones() {
        const res  = await authFetch('/api/publicaciones');
        const data = await res.json();
        const feed = document.getElementById('feed');
        feed.innerHTML = '';

        if (!data.length) {
            feed.innerHTML = '<p style="color:gray;">No hay publicaciones aún.</p>';
            return;
        }

        data.forEach(p => {
            const div = document.createElement('div');
            div.className = 'post';
            div.innerHTML = `
                <div class="post-header">
                    <img src="${p.users?.img_profile || 'perfil.jpg'}" class="foto-perfil">
                    <span class="usuario">${p.users?.full_name || 'Usuario'}</span>
                </div>
                <h4 class="post-titulo">${p.titulo}</h4>
                <span class="categoria" style="background:${colorCategoria(p.categoria)}">${p.categoria}</span>
                <p class="post-texto">${p.datos}</p>
                ${p.media_url ? `<img src="${p.media_url}" class="post-imagen">` : ''}
            `;
            feed.appendChild(div);
        });
    }

    cargarPublicaciones();
</script>

// ─────────────────────────────────────────────────────────
//  CLASE PARA VIDEOLLAMADAS
// ─────────────────────────────────────────────────────────
class VideoCallManager {
    constructor(socket, currentUser) {
        this.socket = socket;
        this.currentUser = currentUser;
        this.peerConnection = null;
        this.localStream = null;
        this.remoteStream = null;
        this.isInCall = false;
        this.currentCallWith = null;
        this.isInitiator = false;
        
        this.configuration = {
            iceServers: [
                { urls: 'stun:stun.l.google.com:19302' },
                { urls: 'stun:stun1.l.google.com:19302' },
                { urls: 'stun:stun2.l.google.com:19302' },
                { urls: 'stun:stun3.l.google.com:19302' },
                { urls: 'stun:stun4.l.google.com:19302' }
            ],
            iceCandidatePoolSize: 10
        };
    }

    async initLocalStream() {
        try {
            console.log('Solicitando acceso a cámara/micrófono...');
            this.localStream = await navigator.mediaDevices.getUserMedia({
                video: {
                    width: { ideal: 1280 },
                    height: { ideal: 720 }
                },
                audio: true
            });
            console.log('Stream obtenido correctamente');
            
            // Mostrar video local inmediatamente
            this.setupVideoElements();
            
            return true;
        } catch (error) {
            console.error('Error al acceder a dispositivos:', error);
            alert('No se pudo acceder a la cámara/micrófono. Por favor verifica los permisos.');
            return false;
        }
    }

    setupVideoElements() {
        const localVideo = document.getElementById('localVideo');
        if (localVideo && this.localStream) {
            localVideo.srcObject = this.localStream;
            console.log('Video local configurado');
        }
    }

    async createPeerConnection() {
        this.peerConnection = new RTCPeerConnection(this.configuration);
        
        // Añadir tracks locales
        if (this.localStream) {
            this.localStream.getTracks().forEach(track => {
                this.peerConnection.addTrack(track, this.localStream);
                console.log('Track añadido:', track.kind);
            });
        }
        
        // Manejar tracks remotos
        this.peerConnection.ontrack = (event) => {
            console.log('Recibiendo track remoto:', event.track.kind);
            if (event.streams && event.streams[0]) {
                this.remoteStream = event.streams[0];
                const remoteVideo = document.getElementById('remoteVideo');
                if (remoteVideo) {
                    remoteVideo.srcObject = this.remoteStream;
                    console.log('Video remoto configurado');
                }
            }
        };
        
        // Manejar ICE candidates
        this.peerConnection.onicecandidate = (event) => {
            if (event.candidate) {
                console.log('Enviando ICE candidate');
                if (this.isInitiator) {
                    this.socket.emit('call-user', {
                        to: this.currentCallWith.id,
                        from: this.currentUser.id,
                        signalData: event.candidate
                    });
                } else {
                    this.socket.emit('accept-call', {
                        to: this.currentCallWith.id,
                        signal: event.candidate
                    });
                }
            }
        };
        
        // Manejar cambios de estado
        this.peerConnection.onconnectionstatechange = () => {
            console.log('Connection state:', this.peerConnection.connectionState);
            if (this.peerConnection.connectionState === 'connected') {
                console.log('¡Conexión establecida exitosamente!');
            } else if (this.peerConnection.connectionState === 'failed') {
                console.error('Conexión fallida');
                this.endCall();
                alert('La conexión de video falló. Intenta nuevamente.');
            }
        };
    }

    async startCall(targetUserId, targetUserName) {
        console.log('Iniciando llamada a:', targetUserName);
        this.isInitiator = true;
        
        if (!this.localStream) {
            const success = await this.initLocalStream();
            if (!success) return;
        }

        this.currentCallWith = { id: targetUserId, name: targetUserName };
        
        await this.createPeerConnection();
        
        try {
            const offer = await this.peerConnection.createOffer();
            await this.peerConnection.setLocalDescription(offer);
            console.log('Offer creado y establecido');
            
            this.socket.emit('call-user', {
                to: targetUserId,
                from: this.currentUser.id,
                signalData: offer
            });
            
            this.isInCall = true;
            this.showCallUI(true);
            console.log('Llamada iniciada - esperando respuesta');
        } catch (error) {
            console.error('Error al iniciar llamada:', error);
            alert('Error al iniciar la llamada: ' + error.message);
        }
    }

    async acceptCall(fromUserId, signal) {
        console.log('Aceptando llamada de:', fromUserId);
        this.isInitiator = false;
        
        if (!this.localStream) {
            const success = await this.initLocalStream();
            if (!success) return;
        }

        this.currentCallWith = { id: fromUserId, name: '' };
        
        await this.createPeerConnection();
        
        try {
            await this.peerConnection.setRemoteDescription(signal);
            console.log('Remote description establecida');
            
            const answer = await this.peerConnection.createAnswer();
            await this.peerConnection.setLocalDescription(answer);
            console.log('Answer creado y establecido');
            
            this.socket.emit('accept-call', {
                to: fromUserId,
                signal: answer
            });
            
            this.isInCall = true;
            this.showCallUI(true);
            console.log('Llamada aceptada - esperando conexión');
        } catch (error) {
            console.error('Error al aceptar llamada:', error);
            alert('Error al aceptar la llamada: ' + error.message);
        }
    }

    async handleRemoteSignal(signal) {
        if (!this.peerConnection) {
            console.log('Peer connection no existe, creando...');
            await this.createPeerConnection();
        }
        
        try {
            if (signal.type === 'offer') {
                console.log('Recibido offer');
                await this.peerConnection.setRemoteDescription(signal);
                const answer = await this.peerConnection.createAnswer();
                await this.peerConnection.setLocalDescription(answer);
                this.socket.emit('accept-call', {
                    to: this.currentCallWith.id,
                    signal: answer
                });
                console.log('Answer enviado');
            } else if (signal.type === 'answer') {
                console.log('Recibido answer');
                await this.peerConnection.setRemoteDescription(signal);
                console.log('Remote description establecida correctamente');
            } else if (signal.candidate) {
                console.log('Recibido ICE candidate');
                try {
                    await this.peerConnection.addIceCandidate(signal);
                    console.log('ICE candidate añadido correctamente');
                } catch (e) {
                    console.error('Error añadiendo ICE candidate:', e);
                }
            }
        } catch (error) {
            console.error('Error manejando señal remota:', error);
        }
    }

    endCall() {
        console.log('Finalizando llamada');
        
        if (this.peerConnection) {
            this.peerConnection.close();
            this.peerConnection = null;
        }
        
        if (this.localStream) {
            this.localStream.getTracks().forEach(track => track.stop());
            this.localStream = null;
        }
        
        this.remoteStream = null;
        this.isInCall = false;
        this.isInitiator = false;
        
        if (this.currentCallWith) {
            this.socket.emit('hangup', { to: this.currentCallWith.id });
            this.currentCallWith = null;
        }
        
        this.showCallUI(false);
        
        const localVideo = document.getElementById('localVideo');
        const remoteVideo = document.getElementById('remoteVideo');
        if (localVideo) localVideo.srcObject = null;
        if (remoteVideo) remoteVideo.srcObject = null;
        
        console.log('Llamada finalizada');
    }

    showCallUI(inCall) {
        const callModal = document.getElementById('videoCallModal');
        if (callModal) {
            callModal.style.display = inCall ? 'flex' : 'none';
        }
        document.body.style.overflow = inCall ? 'hidden' : '';
    }
}

// ─────────────────────────────────────────────────────────
//  SOCKET Y VIDEO
// ─────────────────────────────────────────────────────────
function initSocketAndVideo() {
    socket = io(window.location.origin);
    
    socket.on('connect', () => {
        console.log('Socket conectado');
        socket.emit('register-user', {
            userId: currentUser.id,
            userName: currentUser.full_name
        });
    });
    
    videoCallManager = new VideoCallManager(socket, currentUser);
    
    socket.on('incoming-call', async ({ from, signal }) => {
        console.log('Llamada entrante de:', from);
        pendingCallSignal = signal;
        pendingCaller = from;
        showIncomingCall(from, signal);
    });
    
    socket.on('call-accepted', async ({ signal }) => {
        console.log('Llamada aceptada');
        await videoCallManager.handleRemoteSignal(signal);
    });
    
    socket.on('call-ended', () => {
        console.log('Llamada finalizada por el otro usuario');
        if (videoCallManager.isInCall) {
            videoCallManager.endCall();
            alert('La llamada ha terminado');
        }
    });
    
    socket.on('call-rejected', () => {
        console.log('Llamada rechazada');
        videoCallManager.endCall();
        alert('La llamada fue rechazada');
    });
    
    socket.on('user-offline', ({ userId }) => {
        alert('El usuario no está disponible en este momento');
        videoCallManager.endCall();
    });
}

function showIncomingCall(caller, signal) {
    if (videoCallManager.isInCall) {
        socket.emit('reject-call', { to: caller.userId });
        return;
    }
    
    const notification = document.getElementById('incomingCallNotification');
    const callerNameSpan = document.getElementById('callerName');
    
    callerNameSpan.textContent = caller.userName;
    notification.style.display = 'block';
    
    const acceptBtn = document.getElementById('acceptCallBtn');
    const newAcceptBtn = acceptBtn.cloneNode(true);
    acceptBtn.parentNode.replaceChild(newAcceptBtn, acceptBtn);
    
    newAcceptBtn.onclick = async () => {
        notification.style.display = 'none';
        await videoCallManager.acceptCall(pendingCaller.userId, pendingCallSignal);
        pendingCallSignal = null;
        pendingCaller = null;
    };
    
    const rejectBtn = document.getElementById('rejectCallBtn');
    const newRejectBtn = rejectBtn.cloneNode(true);
    rejectBtn.parentNode.replaceChild(newRejectBtn, rejectBtn);
    
    newRejectBtn.onclick = () => {
        notification.style.display = 'none';
        socket.emit('reject-call', { to: pendingCaller.userId });
        pendingCallSignal = null;
        pendingCaller = null;
    };
    
    setTimeout(() => {
        if (notification.style.display === 'block') {
            notification.style.display = 'none';
            if (pendingCallSignal) {
                socket.emit('reject-call', { to: pendingCaller?.userId });
                pendingCallSignal = null;
                pendingCaller = null;
            }
        }
    }, 30000);
}

function setupVideoControls() {
    const toggleMicBtn = document.getElementById('toggleMicBtn');
    const toggleVideoBtn = document.getElementById('toggleVideoBtn');
    const endCallBtn = document.getElementById('endCallBtn');
    
    if (toggleMicBtn) {
        toggleMicBtn.onclick = () => {
            if (videoCallManager && videoCallManager.localStream) {
                const audioTrack = videoCallManager.localStream.getAudioTracks()[0];
                if (audioTrack) {
                    audioTrack.enabled = !audioTrack.enabled;
                    toggleMicBtn.textContent = audioTrack.enabled ? '🎤 Micrófono' : '🔇 Micrófono OFF';
                }
            }
        };
    }
    
    if (toggleVideoBtn) {
        toggleVideoBtn.onclick = () => {
            if (videoCallManager && videoCallManager.localStream) {
                const videoTrack = videoCallManager.localStream.getVideoTracks()[0];
                if (videoTrack) {
                    videoTrack.enabled = !videoTrack.enabled;
                    toggleVideoBtn.textContent = videoTrack.enabled ? '📷 Cámara' : '📷 Cámara OFF';
                }
            }
        };
    }
    
    if (endCallBtn) {
        endCallBtn.onclick = () => {
            if (videoCallManager) {
                videoCallManager.endCall();
            }
        };
    }
}

async function cargarAmigos() {
    const res   = await authFetch('/api/friends');
    const lista = await res.json();
    const cont  = document.getElementById('listaAmigos');
    cont.innerHTML = '';

    if (!lista.length) {
        cont.innerHTML = '<p class="sin-amigos">Busca usuarios<br>y agrégalos</p>';
        return;
    }

    lista.forEach(u => {
        const div = document.createElement('div');
        div.className = 'user-item';
        div.title = u.full_name;
        div.innerHTML = `
            <div class="user-avatar">${iniciales(u.full_name)}</div>
            <span class="user-name">${u.full_name}</span>`;
        div.onclick = (e) => abrirChat(u, e.currentTarget);
        cont.appendChild(div);
    });
}

async function buscarUsuario() {
    const q    = document.getElementById('buscarInput').value.trim();
    if (!q) return;

    const res   = await authFetch(`/api/users/search?q=${encodeURIComponent(q)}`);
    const users = await res.json();
    const drop  = document.getElementById('resultadosBusqueda');

    if (!users.length) {
        drop.innerHTML = '<div class="res-item">Sin resultados</div>';
        drop.style.display = 'block';
        return;
    }

    drop.innerHTML = '';
    users.forEach(u => {
        const div = document.createElement('div');
        div.className = 'res-item';
        div.innerHTML = `
            <strong>${u.full_name}</strong>
            <span>${u.email}</span>
            <button onclick="agregarAmigo(${u.id}, '${u.full_name}')">+ Agregar</button>`;
        drop.appendChild(div);
    });
    drop.style.display = 'block';
}

async function agregarAmigo(friend_id, nombre) {
    const res = await authFetch('/api/friends', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ friend_id })
    });
    if (res.ok) {
        document.getElementById('resultadosBusqueda').style.display = 'none';
        document.getElementById('buscarInput').value = '';
        cargarAmigos();
        alert(`✅ ${nombre} agregado a tus contactos`);
    } else {
        const d = await res.json();
        alert(d.error || 'Error al agregar');
    }
}

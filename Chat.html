// ─────────────────────────────────────────────────────────
//  CLASE PARA VIDEOLLAMADAS
// ─────────────────────────────────────────────────────────
class VideoCallManager {
    constructor(socket, currentUser) {
        this.socket = socket;
        this.currentUser = currentUser;
        this.peerConnection = null;
        this.localStream = null;
        this.remoteStream = null;
        this.isInCall = false;
        this.currentCallWith = null;
        
        this.configuration = {
            iceServers: [
                { urls: 'stun:stun.l.google.com:19302' },
                { urls: 'stun:stun1.l.google.com:19302' },
                { urls: 'stun:stun2.l.google.com:19302' }
            ]
        };
    }

    async initLocalStream() {
        try {
            this.localStream = await navigator.mediaDevices.getUserMedia({
                video: true,
                audio: true
            });
            return true;
        } catch (error) {
            console.error('Error accessing media devices:', error);
            alert('No se pudo acceder a la cámara/micrófono. Por favor verifica los permisos.');
            return false;
        }
    }

    setupVideoElements() {
        const localVideo = document.getElementById('localVideo');
        if (localVideo && this.localStream) {
            localVideo.srcObject = this.localStream;
        }
    }

    async startCall(targetUserId, targetUserName) {
        if (!this.localStream) {
            const success = await this.initLocalStream();
            if (!success) return;
        }

        this.currentCallWith = { id: targetUserId, name: targetUserName };
        
        this.peerConnection = new RTCPeerConnection(this.configuration);
        
        // Add local stream tracks
        this.localStream.getTracks().forEach(track => {
            this.peerConnection.addTrack(track, this.localStream);
        });

        // Handle remote stream
        this.peerConnection.ontrack = (event) => {
            this.remoteStream = event.streams[0];
            const remoteVideo = document.getElementById('remoteVideo');
            if (remoteVideo) {
                remoteVideo.srcObject = this.remoteStream;
            }
        };

        // Handle ICE candidates
        this.peerConnection.onicecandidate = (event) => {
            if (event.candidate) {
                this.socket.emit('call-user', {
                    to: targetUserId,
                    from: this.currentUser.id,
                    signalData: event.candidate
                });
            }
        };

        // Handle connection state
        this.peerConnection.onconnectionstatechange = () => {
            if (this.peerConnection.connectionState === 'disconnected' ||
                this.peerConnection.connectionState === 'failed' ||
                this.peerConnection.connectionState === 'closed') {
                this.endCall();
            }
        };

        try {
            // Create offer
            const offer = await this.peerConnection.createOffer();
            await this.peerConnection.setLocalDescription(offer);

            this.socket.emit('call-user', {
                to: targetUserId,
                from: this.currentUser.id,
                signalData: offer
            });

            this.isInCall = true;
            this.showCallUI(true);
            this.setupVideoElements();
        } catch (error) {
            console.error('Error starting call:', error);
            alert('Error al iniciar la llamada');
        }
    }

    async acceptCall(fromUserId, signal) {
        if (!this.localStream) {
            const success = await this.initLocalStream();
            if (!success) return;
        }

        this.currentCallWith = { id: fromUserId, name: '' };
        
        this.peerConnection = new RTCPeerConnection(this.configuration);
        
        this.localStream.getTracks().forEach(track => {
            this.peerConnection.addTrack(track, this.localStream);
        });

        this.peerConnection.ontrack = (event) => {
            this.remoteStream = event.streams[0];
            const remoteVideo = document.getElementById('remoteVideo');
            if (remoteVideo) {
                remoteVideo.srcObject = this.remoteStream;
            }
        };

        this.peerConnection.onicecandidate = (event) => {
            if (event.candidate) {
                this.socket.emit('accept-call', {
                    to: fromUserId,
                    signal: event.candidate
                });
            }
        };

        try {
            await this.peerConnection.setRemoteDescription(signal);
            const answer = await this.peerConnection.createAnswer();
            await this.peerConnection.setLocalDescription(answer);

            this.socket.emit('accept-call', {
                to: fromUserId,
                signal: answer
            });

            this.isInCall = true;
            this.showCallUI(true);
            this.setupVideoElements();
        } catch (error) {
            console.error('Error accepting call:', error);
        }
    }

    async handleRemoteSignal(signal) {
        if (!this.peerConnection) return;
        
        try {
            if (signal.type === 'offer') {
                await this.peerConnection.setRemoteDescription(signal);
                const answer = await this.peerConnection.createAnswer();
                await this.peerConnection.setLocalDescription(answer);
                this.socket.emit('accept-call', {
                    to: this.currentCallWith?.id,
                    signal: answer
                });
            } else if (signal.type === 'answer') {
                await this.peerConnection.setRemoteDescription(signal);
            } else if (signal.candidate) {
                await this.peerConnection.addIceCandidate(signal);
            }
        } catch (error) {
            console.error('Error handling remote signal:', error);
        }
    }

    endCall() {
        if (this.peerConnection) {
            this.peerConnection.close();
            this.peerConnection = null;
        }
        
        if (this.localStream) {
            this.localStream.getTracks().forEach(track => track.stop());
            this.localStream = null;
        }
        
        this.remoteStream = null;
        this.isInCall = false;
        this.currentCallWith = null;
        this.showCallUI(false);
        
        // Clear video elements
        const localVideo = document.getElementById('localVideo');
        const remoteVideo = document.getElementById('remoteVideo');
        if (localVideo) localVideo.srcObject = null;
        if (remoteVideo) remoteVideo.srcObject = null;
        
        // Notify other user if needed
        if (this.currentCallWith) {
            this.socket.emit('hangup', { to: this.currentCallWith.id });
        }
    }

    showCallUI(inCall) {
        const callModal = document.getElementById('videoCallModal');
        if (callModal) {
            callModal.style.display = inCall ? 'flex' : 'none';
        }
        
        // Disable/enable scroll on body
        document.body.style.overflow = inCall ? 'hidden' : '';
    }
}

// ─────────────────────────────────────────────────────────
//  INIT — redirige si no hay sesión
// ─────────────────────────────────────────────────────────
window.addEventListener('DOMContentLoaded', () => {
    token       = localStorage.getItem('token');
    currentUser = JSON.parse(localStorage.getItem('user') || 'null');

    if (!token || !currentUser) {
        window.location.href = 'InicioS.html';
        return;
    }

    initSocketAndVideo();
    cargarAmigos();
});

// ─────────────────────────────────────────────────────────
//  SOCKET Y VIDEO
// ─────────────────────────────────────────────────────────
function initSocketAndVideo() {
    socket = io(window.location.origin);
    
    socket.on('connect', () => {
        console.log('Socket conectado');
        socket.emit('register-user', {
            userId: currentUser.id,
            userName: currentUser.full_name
        });
    });
    
    videoCallManager = new VideoCallManager(socket, currentUser);
    
    // Escuchar llamada entrante
    socket.on('incoming-call', async ({ from, signal }) => {
        showIncomingCall(from, signal);
    });
    
    // Escuchar aceptación de llamada
    socket.on('call-accepted', async ({ signal }) => {
        await videoCallManager.handleRemoteSignal(signal);
    });
    
    // Escuchar fin de llamada
    socket.on('call-ended', () => {
        if (videoCallManager.isInCall) {
            videoCallManager.endCall();
            alert('La llamada ha terminado');
        }
    });
    
    // Escuchar rechazo de llamada
    socket.on('call-rejected', () => {
        videoCallManager.endCall();
        alert('La llamada fue rechazada');
    });
    
    // Usuario offline
    socket.on('user-offline', ({ userId }) => {
        alert('El usuario no está disponible en este momento');
        videoCallManager.endCall();
    });
}

// Mostrar notificación de llamada entrante
let pendingCallSignal = null;
let pendingCaller = null;

function showIncomingCall(caller, signal) {
    if (videoCallManager.isInCall) {
        // Si ya está en una llamada, rechazar automáticamente
        socket.emit('reject-call', { to: caller.userId });
        return;
    }
    
    pendingCaller = caller;
    pendingCallSignal = signal;
    
    const notification = document.getElementById('incomingCallNotification');
    const callerNameSpan = document.getElementById('callerName');
    
    callerNameSpan.textContent = caller.userName;
    notification.style.display = 'block';
    
    // Aceptar llamada
    const acceptBtn = document.getElementById('acceptCallBtn');
    const newAcceptBtn = acceptBtn.cloneNode(true);
    acceptBtn.parentNode.replaceChild(newAcceptBtn, acceptBtn);
    
    newAcceptBtn.onclick = async () => {
        notification.style.display = 'none';
        await videoCallManager.acceptCall(pendingCaller.userId, pendingCallSignal);
        pendingCallSignal = null;
        pendingCaller = null;
    };
    
    // Rechazar llamada
    const rejectBtn = document.getElementById('rejectCallBtn');
    const newRejectBtn = rejectBtn.cloneNode(true);
    rejectBtn.parentNode.replaceChild(newRejectBtn, rejectBtn);
    
    newRejectBtn.onclick = () => {
        notification.style.display = 'none';
        socket.emit('reject-call', { to: pendingCaller.userId });
        pendingCallSignal = null;
        pendingCaller = null;
    };
    
    // Auto-cerrar después de 30 segundos
    setTimeout(() => {
        if (notification.style.display === 'block') {
            notification.style.display = 'none';
            if (pendingCallSignal) {
                socket.emit('reject-call', { to: pendingCaller?.userId });
                pendingCallSignal = null;
                pendingCaller = null;
            }
        }
    }, 30000);
}

// ─────────────────────────────────────────────────────────
//  AMIGOS
// ─────────────────────────────────────────────────────────
async function cargarAmigos() {
    const res   = await authFetch('/api/friends');
    const lista = await res.json();
    const cont  = document.getElementById('listaAmigos');
    cont.innerHTML = '';

    if (!lista.length) {
        cont.innerHTML = '<p class="sin-amigos">Busca usuarios<br>y agrégalos</p>';
        return;
    }

    lista.forEach(u => {
        const div = document.createElement('div');
        div.className = 'user-item';
        div.title = u.full_name;
        div.innerHTML = `
            <div class="user-avatar">${iniciales(u.full_name)}</div>
            <span class="user-name">${u.full_name}</span>`;
        div.onclick = (e) => abrirChat(u, e.currentTarget);
        cont.appendChild(div);
    });
}

// ─────────────────────────────────────────────────────────
//  BÚSQUEDA
// ─────────────────────────────────────────────────────────
async function buscarUsuario() {
    const q    = document.getElementById('buscarInput').value.trim();
    if (!q) return;

    const res   = await authFetch(`/api/users/search?q=${encodeURIComponent(q)}`);
    const users = await res.json();
    const drop  = document.getElementById('resultadosBusqueda');

    if (!users.length) {
        drop.innerHTML = '<div class="res-item">Sin resultados</div>';
        drop.style.display = 'block';
        return;
    }

    drop.innerHTML = '';
    users.forEach(u => {
        const div = document.createElement('div');
        div.className = 'res-item';
        div.innerHTML = `
            <strong>${u.full_name}</strong>
            <span>${u.email}</span>
            <button onclick="agregarAmigo(${u.id}, '${u.full_name}')">+ Agregar</button>`;
        drop.appendChild(div);
    });
    drop.style.display = 'block';
}

async function agregarAmigo(friend_id, nombre) {
    const res = await authFetch('/api/friends', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ friend_id })
    });
    if (res.ok) {
        document.getElementById('resultadosBusqueda').style.display = 'none';
        document.getElementById('buscarInput').value = '';
        cargarAmigos();
        alert(`✅ ${nombre} agregado a tus contactos`);
    } else {
        const d = await res.json();
        alert(d.error || 'Error al agregar');
    }
}

// Cerrar dropdown al hacer click fuera
document.addEventListener('click', e => {
    if (!e.target.closest('.Busqueda') && !e.target.closest('.resultados-dropdown'))
        document.getElementById('resultadosBusqueda').style.display = 'none';

// ─────────────────────────────────────────────────────────
//  CHAT
// ─────────────────────────────────────────────────────────
async function abrirChat(friend, el) {
    activeFriend = friend;

    document.getElementById('chatHeader').innerHTML = `
        <div class="user-avatar-hdr">${iniciales(friend.full_name)}</div>
        <div>
            <strong>${friend.full_name}</strong>
            <p class="online">Online</p>
        </div>
        <div class="chat-actions">
            <button class="btn btn-outline-success btn-sm" onclick="startVideoCall()">📹 Videollamada</button>
        </div>`;

    document.querySelectorAll('.user-item').forEach(i => i.classList.remove('activo'));
    el.classList.add('activo');

    await cargarMensajes();
    suscribirRealtime();
}

// Función para iniciar videollamada
async function startVideoCall() {
    if (!activeFriend) {
        alert('Selecciona un contacto primero');
        return;
    }
    
    if (!videoCallManager) {
        alert('Sistema de video no disponible');
        return;
    }
    
    await videoCallManager.startCall(activeFriend.id, activeFriend.full_name);
}

async function cargarMensajes() {
    const res  = await authFetch(`/api/messages/${activeFriend.id}`);
    const msgs = await res.json();
    const cont = document.getElementById('chatMessages');
    cont.innerHTML = '';
    msgs.forEach(m => agregarBurbuja(m));
    cont.scrollTop = cont.scrollHeight;
}

function agregarBurbuja(m) {
    const cont  = document.getElementById('chatMessages');
    const esMio = m.username === currentUser.full_name;
    const div   = document.createElement('div');
    div.className = 'message ' + (esMio ? 'propio' : 'ajeno');
    div.innerHTML = `
        ${!esMio ? `<span class="msg-autor">${m.username}</span>` : ''}
        <p>${escapeHtml(m.message)}</p>
        <span class="msg-hora">${formatHora(m.created_at)}</span>`;
    cont.appendChild(div);
    cont.scrollTop = cont.scrollHeight;
}

async function enviarMensaje() {
    if (!activeFriend) return;
    const input = document.getElementById('msgInput');
    const text  = input.value.trim();
    if (!text) return;

    input.value = '';
    input.focus();

    await authFetch('/api/messages', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ to_user_id: activeFriend.id, message: text })
    });
}

function enterEnviar(e) {
    if (e.key === 'Enter') enviarMensaje();
}

// ─────────────────────────────────────────────────────────
//  SUPABASE REALTIME
// ─────────────────────────────────────────────────────────
function buildChatId(id1, id2) {
    return [id1, id2].sort().join('_');
}

function suscribirRealtime() {
    if (realtimeSub) sbClient.removeChannel(realtimeSub);

    const chatId = buildChatId(currentUser.id, activeFriend.id);

    realtimeSub = sbClient
        .channel('messages-' + chatId)
        .on('postgres_changes', {
            event: 'INSERT',
            schema: 'public',
            table: 'messages',
            filter: `chat_id=eq.${chatId}`
        }, payload => {
            agregarBurbuja(payload.new);
        })
        .subscribe();
}

// ─────────────────────────────────────────────────────────
//  CONTROLES DE VIDEO
// ─────────────────────────────────────────────────────────
// Esperar a que los elementos del DOM estén listos
document.addEventListener('DOMContentLoaded', () => {
    // Configurar controles de video después de que existan
    setTimeout(() => {
        const toggleMicBtn = document.getElementById('toggleMicBtn');
        const toggleVideoBtn = document.getElementById('toggleVideoBtn');
        const endCallBtn = document.getElementById('endCallBtn');
        
        if (toggleMicBtn) {
            toggleMicBtn.onclick = () => {
                if (videoCallManager && videoCallManager.localStream) {
                    const audioTrack = videoCallManager.localStream.getAudioTracks()[0];
                    if (audioTrack) {
                        audioTrack.enabled = !audioTrack.enabled;
                        toggleMicBtn.textContent = audioTrack.enabled ? '🎤 Micrófono' : '🔇 Micrófono OFF';
                    }
                }
            };
        }
        
        if (toggleVideoBtn) {
            toggleVideoBtn.onclick = () => {
                if (videoCallManager && videoCallManager.localStream) {
                    const videoTrack = videoCallManager.localStream.getVideoTracks()[0];
                    if (videoTrack) {
                        videoTrack.enabled = !videoTrack.enabled;
                        toggleVideoBtn.textContent = videoTrack.enabled ? '📷 Cámara' : '📷 Cámara OFF';
                    }
                }
            };
        }
        
        if (endCallBtn) {
            endCallBtn.onclick = () => {
                if (videoCallManager) {
                    videoCallManager.endCall();
                }
            };
        }
    }, 100);
});

// ─────────────────────────────────────────────────────────
//  HELPERS
// ─────────────────────────────────────────────────────────
function authFetch(url, opts = {}) {
    return fetch(url, {
        ...opts,
        headers: { ...(opts.headers || {}), 'Authorization': `Bearer ${token}` }
    });
}

function logout() {
    if (videoCallManager && videoCallManager.isInCall) {
        videoCallManager.endCall();
    }
    if (socket) {
        socket.disconnect();
    }
    localStorage.clear();
    window.location.href = 'InicioS.html';
}

function iniciales(nombre) {
    return nombre.split(' ').slice(0, 2).map(n => n[0]).join('').toUpperCase();
}

function escapeHtml(str) {
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function formatHora(ts) {
    if (!ts) return '';
    return new Date(ts).toLocaleTimeString('es-MX', { hour: '2-digit', minute: '2-digit' });
}

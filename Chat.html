// ─────────────────────────────────────────────────────────

class VideoCallManager {
    constructor(socket, currentUser) {
        this.socket = socket;
        this.currentUser = currentUser;
        this.peerConnection = null;
        this.localStream = null;
        this.remoteStream = null;
        this.isInCall = false;
        this.currentCallWith = null;
        
        this.configuration = {
            iceServers: [
                { urls: 'stun:stun.relay.metered.ca:80' },
                {
                    urls: 'turn:global.relay.metered.ca:80',
                    username: '9f4e271e08ea6740306b75a9',
                    credential: 'TYOXGgRZdHOOdwu4'
                },
                {
                    urls: 'turn:global.relay.metered.ca:80?transport=tcp',
                    username: '9f4e271e08ea6740306b75a9',
                    credential: 'TYOXGgRZdHOOdwu4'
                },
                {
                    urls: 'turn:global.relay.metered.ca:443',
                    username: '9f4e271e08ea6740306b75a9',
                    credential: 'TYOXGgRZdHOOdwu4'
                },
                {
                    urls: 'turns:global.relay.metered.ca:443?transport=tcp',
                    username: '9f4e271e08ea6740306b75a9',
                    credential: 'TYOXGgRZdHOOdwu4'
                }
            ]
        };
    }

    async initLocalStream() {
        try {
            console.log('📷 Solicitando acceso a cámara/micrófono...');
            this.localStream = await navigator.mediaDevices.getUserMedia({
                video: true,
                audio: true
            });
            console.log('✅ Stream obtenido correctamente');
            
            const localVideo = document.getElementById('localVideo');
            if (localVideo) {
                localVideo.srcObject = this.localStream;
                console.log('📹 Video local configurado');
            }
            return true;
        } catch (error) {
            console.error('❌ Error al acceder a dispositivos:', error);
            alert('No se pudo acceder a la cámara/micrófono. Por favor verifica los permisos.');
            return false;
        }
    }

    async startCall(targetUserId, targetUserName) {
        console.log(`📞 Iniciando llamada a: ${targetUserName}`);
        
        if (!this.localStream) {
            const success = await this.initLocalStream();
            if (!success) return;
        }

        this.currentCallWith = { id: targetUserId, name: targetUserName };
        
        // Crear conexión peer
        this.peerConnection = new RTCPeerConnection(this.configuration);
        
        // Añadir stream local
        this.localStream.getTracks().forEach(track => {
            this.peerConnection.addTrack(track, this.localStream);
            console.log(`➕ Track añadido: ${track.kind}`);
        });
        
        // Manejar stream remoto
        this.peerConnection.ontrack = (event) => {
            console.log('📡 Recibiendo stream remoto');
            this.remoteStream = event.streams[0];
            const remoteVideo = document.getElementById('remoteVideo');
            if (remoteVideo) {
                remoteVideo.srcObject = this.remoteStream;
                console.log('📹 Video remoto configurado');
            }
        };
        
        // Manejar ICE candidates
        this.peerConnection.onicecandidate = (event) => {
            if (event.candidate) {
                console.log('🔄 Enviando ICE candidate (caller)');
                this.socket.emit('ice-candidate-caller', {
                    to: targetUserId,
                    candidate: event.candidate
                });
            }
        };
        
        // Estado de la conexión
        this.peerConnection.onconnectionstatechange = () => {
            console.log(`🔌 Estado conexión: ${this.peerConnection.connectionState}`);
            if (this.peerConnection.connectionState === 'connected') {
                console.log('✅ Conexión establecida exitosamente!');
            } else if (this.peerConnection.connectionState === 'failed') {
                console.error('❌ Conexión fallida');
                this.endCall();
            }
        };
        
        try {
            const offer = await this.peerConnection.createOffer();
            await this.peerConnection.setLocalDescription(offer);
            console.log('📤 Offer creado y enviado');
            
            this.socket.emit('call-user', {
                to: targetUserId,
                from: this.currentUser.id,
                signalData: offer
            });
            
            this.isInCall = true;
            this.showCallUI(true);
        } catch (error) {
            console.error('❌ Error al iniciar llamada:', error);
        }
    }

    async acceptCall(fromUserId, signal) {
        console.log(`📞 Aceptando llamada de: ${fromUserId}`);
        
        if (!this.localStream) {
            const success = await this.initLocalStream();
            if (!success) return;
        }

        this.currentCallWith = { id: fromUserId, name: '' };
        
        // Crear conexión peer
        this.peerConnection = new RTCPeerConnection(this.configuration);
        
        // Añadir stream local
        this.localStream.getTracks().forEach(track => {
            this.peerConnection.addTrack(track, this.localStream);
            console.log(`➕ Track añadido: ${track.kind}`);
        });
        
        // Manejar stream remoto
        this.peerConnection.ontrack = (event) => {
            console.log('📡 Recibiendo stream remoto');
            this.remoteStream = event.streams[0];
            const remoteVideo = document.getElementById('remoteVideo');
            if (remoteVideo) {
                remoteVideo.srcObject = this.remoteStream;
                console.log('📹 Video remoto configurado');
            }
        };
        
        // Manejar ICE candidates
        this.peerConnection.onicecandidate = (event) => {
            if (event.candidate) {
                console.log('🔄 Enviando ICE candidate (callee)');
                this.socket.emit('ice-candidate-callee', {
                    to: fromUserId,
                    candidate: event.candidate
                });
            }
        };
        
        try {
            await this.peerConnection.setRemoteDescription(signal);
            console.log('📥 Remote description establecida');
            
            const answer = await this.peerConnection.createAnswer();
            await this.peerConnection.setLocalDescription(answer);
            console.log('📤 Answer creado y enviado');
            
            this.socket.emit('accept-call', {
                to: fromUserId,
                signal: answer
            });
            
            this.isInCall = true;
            this.showCallUI(true);
        } catch (error) {
            console.error('❌ Error al aceptar llamada:', error);
        }
    }

    async handleRemoteSignal(signal) {
        if (!this.peerConnection) {
            console.log('⚠️ Peer connection no existe');
            return;
        }
        
        try {
            if (signal.type === 'offer') {
                console.log('📥 Recibido offer');
                await this.peerConnection.setRemoteDescription(signal);
                const answer = await this.peerConnection.createAnswer();
                await this.peerConnection.setLocalDescription(answer);
                this.socket.emit('accept-call', {
                    to: this.currentCallWith.id,
                    signal: answer
                });
                console.log('📤 Answer enviado');
            } else if (signal.type === 'answer') {
                console.log('📥 Recibido answer');
                await this.peerConnection.setRemoteDescription(signal);
                console.log('✅ Remote description establecida');
            } else if (signal.candidate) {
                console.log('📥 Recibido ICE candidate');
                await this.peerConnection.addIceCandidate(signal);
                console.log('✅ ICE candidate añadido');
            }
        } catch (error) {
            console.error('❌ Error manejando señal:', error);
        }
    }

    endCall() {
        console.log('🔴 Finalizando llamada');
        
        if (this.peerConnection) {
            this.peerConnection.close();
            this.peerConnection = null;
        }
        
        if (this.localStream) {
            this.localStream.getTracks().forEach(track => track.stop());
            this.localStream = null;
        }
        
        this.remoteStream = null;
        this.isInCall = false;
        
        if (this.currentCallWith) {
            this.socket.emit('hangup', { to: this.currentCallWith.id });
            this.currentCallWith = null;
        }
        
        this.showCallUI(false);
        
        const localVideo = document.getElementById('localVideo');
        const remoteVideo = document.getElementById('remoteVideo');
        if (localVideo) localVideo.srcObject = null;
        if (remoteVideo) remoteVideo.srcObject = null;
    }

    showCallUI(inCall) {
        const callModal = document.getElementById('videoCallModal');
        if (callModal) {
            callModal.style.display = inCall ? 'flex' : 'none';
        }
        document.body.style.overflow = inCall ? 'hidden' : '';
    }
}

// ─────────────────────────────────────────────────────────
//  SOCKET Y VIDEO
// ─────────────────────────────────────────────────────────
function initSocketAndVideo() {
    socket = io();
    
    socket.on('connect', () => {
        console.log('✅ Socket conectado');
        socket.emit('register-user', {
            userId: currentUser.id,
            userName: currentUser.full_name
        });
    });
    
    videoCallManager = new VideoCallManager(socket, currentUser);
    
    socket.on('incoming-call', ({ from, signal }) => {
        console.log('📞 Llamada entrante de:', from);
        pendingCallSignal = signal;
        pendingCaller = from;
        showIncomingCall(from, signal);
    });
    
    socket.on('call-accepted', ({ signal }) => {
        console.log('✅ Llamada aceptada');
        videoCallManager.handleRemoteSignal(signal);
    });
    
    socket.on('ice-candidate-from-callee', ({ candidate }) => {
        console.log('📥 ICE candidate del que acepta');
        if (videoCallManager && videoCallManager.peerConnection) {
            videoCallManager.peerConnection.addIceCandidate(candidate).catch(err => {
                console.error('❌ Error agregando ICE candidate:', err);
            });
        }
    });
    
    socket.on('ice-candidate-from-caller', ({ candidate }) => {
        console.log('📥 ICE candidate del que llama');
        if (videoCallManager && videoCallManager.peerConnection) {
            videoCallManager.peerConnection.addIceCandidate(candidate).catch(err => {
                console.error('❌ Error agregando ICE candidate:', err);
            });
        }
    });
    
    socket.on('call-ended', () => {
        console.log('🔴 Llamada finalizada');
        if (videoCallManager.isInCall) {
            videoCallManager.endCall();
            alert('La llamada ha terminado');
        }
    });
    
    socket.on('call-rejected', () => {
        console.log('❌ Llamada rechazada');
        videoCallManager.endCall();
        alert('La llamada fue rechazada');
    });
    
    socket.on('user-offline', () => {
        alert('El usuario no está disponible');
        videoCallManager.endCall();
    });
}

function showIncomingCall(caller, signal) {
    if (videoCallManager.isInCall) {
        socket.emit('reject-call', { to: caller.userId });
        return;
    }
    
    const notification = document.getElementById('incomingCallNotification');
    document.getElementById('callerName').textContent = caller.userName;
    notification.style.display = 'block';
    
    document.getElementById('acceptCallBtn').onclick = async () => {
        notification.style.display = 'none';
        await videoCallManager.acceptCall(caller.userId, signal);
    };
    
    document.getElementById('rejectCallBtn').onclick = () => {
        notification.style.display = 'none';
        socket.emit('reject-call', { to: caller.userId });
    };
    
    setTimeout(() => {
        if (notification.style.display === 'block') {
            notification.style.display = 'none';
            socket.emit('reject-call', { to: caller.userId });
        }
    }, 30000);
}

function setupVideoControls() {
    const toggleMicBtn = document.getElementById('toggleMicBtn');
    const toggleVideoBtn = document.getElementById('toggleVideoBtn');
    const endCallBtn = document.getElementById('endCallBtn');
    
    if (toggleMicBtn) {
        toggleMicBtn.onclick = () => {
            if (videoCallManager && videoCallManager.localStream) {
                const audioTrack = videoCallManager.localStream.getAudioTracks()[0];
                if (audioTrack) {
                    audioTrack.enabled = !audioTrack.enabled;
                    toggleMicBtn.textContent = audioTrack.enabled ? '🎤 Micrófono' : '🔇 Micrófono OFF';
                }
            }
        };
    }
    
    if (toggleVideoBtn) {
        toggleVideoBtn.onclick = () => {
            if (videoCallManager && videoCallManager.localStream) {
                const videoTrack = videoCallManager.localStream.getVideoTracks()[0];
                if (videoTrack) {
                    videoTrack.enabled = !videoTrack.enabled;
                    toggleVideoBtn.textContent = videoTrack.enabled ? '📷 Cámara' : '📷 Cámara OFF';
                }
            }
        };
    }
    
    if (endCallBtn) {
        endCallBtn.onclick = () => {
            if (videoCallManager) {
                videoCallManager.endCall();
            }
        };
    }
}

async function cargarAmigos() {
    const res = await authFetch('/api/friends');
    const lista = await res.json();
    const cont = document.getElementById('listaAmigos');
    cont.innerHTML = '';

    if (!lista.length) {
        cont.innerHTML = '<div class="user" style="margin-top: 20px;"></div><p class="sin-amigos" style="color: white; text-align: center;">Busca usuarios<br>y agrégalos</p>';
        return;
    }

    lista.forEach(u => {
        const div = document.createElement('div');
        div.className = 'user';
        div.title = u.full_name;
        div.style.cursor = 'pointer';
        div.style.display = 'flex';
        div.style.alignItems = 'center';
        div.style.justifyContent = 'center';
        div.style.background = '#2b3a4f';
        div.innerHTML = `${iniciales(u.full_name)}`;
        div.onclick = (e) => abrirChat(u, div);
        cont.appendChild(div);
    });
}

async function buscarUsuario() {
    const q = document.getElementById('buscarInput').value.trim();
    if (!q) return;

    const res = await authFetch(`/api/users/search?q=${encodeURIComponent(q)}`);
    const users = await res.json();
    const drop = document.getElementById('resultadosBusqueda');

    if (!users.length) {
        drop.innerHTML = '<div class="res-item">Sin resultados</div>';
        drop.style.display = 'block';
        return;
    }

    drop.innerHTML = '';
    drop.style.background = 'white';
    drop.style.color = 'black';
    drop.style.padding = '10px';
    drop.style.borderRadius = '5px';
    
    users.forEach(u => {
        const div = document.createElement('div');
        div.className = 'res-item';
        div.style.padding = '10px';
        div.style.borderBottom = '1px solid #ccc';
        div.style.display = 'flex';
        div.style.justifyContent = 'space-between';
        div.innerHTML = `
            <strong>${u.full_name}</strong>
            <span>${u.email}</span>
            <button onclick="agregarAmigo(${u.id}, '${u.full_name}')" style="background:#446447; color:white; border:none; padding:5px 10px; border-radius:5px; cursor:pointer;">+ Agregar</button>`;
        drop.appendChild(div);
    });
    drop.style.display = 'block';
}

async function agregarAmigo(friend_id, nombre) {
    const res = await authFetch('/api/friends', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ friend_id })
    });
    if (res.ok) {
        document.getElementById('resultadosBusqueda').style.display = 'none';
        document.getElementById('buscarInput').value = '';
        cargarAmigos();
        alert(`✅ ${nombre} agregado a tus contactos`);
    } else {
        const d = await res.json();
        alert(d.error || 'Error al agregar');
    }
}

document.addEventListener('click', e => {
    if (!e.target.closest('.Busqueda') && !e.target.closest('.resultados-dropdown'))
        document.getElementById('resultadosBusqueda').style.display = 'none';
});

async function abrirChat(friend, el) {
    activeFriend = friend;

    document.getElementById('chatHeader').innerHTML = `
        <div class="avatar" style="background:#446447; display:flex; align-items:center; justify-content:center; color:white;">${iniciales(friend.full_name)}</div>
        <div>
            <strong>${friend.full_name}</strong>
            <p class="online">Online</p>
        </div>
        <div class="chat-actions" style="margin-left:auto;">
            <button class="btn btn-outline-success btn-sm" onclick="startVideoCall()" style="background:#446447; color:white; border:none; padding:5px 15px; border-radius:5px;">📹 Videollamada</button>
        </div>`;

    document.querySelectorAll('.user').forEach(i => i.classList.remove('activo'));
    if (el) el.classList.add('activo');

    await cargarMensajes();
    suscribirRealtime();
}

async function startVideoCall() {
    if (!activeFriend) {
        alert('Selecciona un contacto primero');
        return;
    }
    
    if (!videoCallManager) {
        alert('Sistema de video no disponible');
        return;
    }
    
    await videoCallManager.startCall(activeFriend.id, activeFriend.full_name);
}

async function cargarMensajes() {
    const res = await authFetch(`/api/messages/${activeFriend.id}`);
    const msgs = await res.json();
    const cont = document.getElementById('chatMessages');
    cont.innerHTML = '';
    msgs.forEach(m => agregarBurbuja(m));
    cont.scrollTop = cont.scrollHeight;
}

function agregarBurbuja(m) {
    const cont = document.getElementById('chatMessages');
    const esMio = m.username === currentUser.full_name;
    const div = document.createElement('div');
    div.className = 'message ' + (esMio ? 'propio' : 'ajeno');
    div.innerHTML = `
        ${!esMio ? `<span class="msg-autor" style="font-size:12px;">${m.username}</span><br>` : ''}
        <span>${escapeHtml(m.message)}</span>
        <div class="msg-hora" style="font-size:10px; margin-top:5px;">${formatHora(m.created_at)}</div>`;
    cont.appendChild(div);
    cont.scrollTop = cont.scrollHeight;
}

async function enviarMensaje() {
    if (!activeFriend) return;
    const input = document.getElementById('msgInput');
    const text = input.value.trim();
    if (!text) return;

    input.value = '';
    input.focus();

    await authFetch('/api/messages', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ to_user_id: activeFriend.id, message: text })
    });
}

function enterEnviar(e) {
    if (e.key === 'Enter') enviarMensaje();
}

function buildChatId(id1, id2) {
    return [id1, id2].sort().join('_');
}

function suscribirRealtime() {
    if (realtimeSub) sbClient.removeChannel(realtimeSub);

    const chatId = buildChatId(currentUser.id, activeFriend.id);

    realtimeSub = sbClient
        .channel('messages-' + chatId)
        .on('postgres_changes', {
            event: 'INSERT',
            schema: 'public',
            table: 'messages',
            filter: `chat_id=eq.${chatId}`
        }, payload => {
            agregarBurbuja(payload.new);
        })
        .subscribe();
}

function authFetch(url, opts = {}) {
    return fetch(url, {
        ...opts,
        headers: { ...(opts.headers || {}), 'Authorization': `Bearer ${token}` }
    });
}

function logout() {
    if (videoCallManager && videoCallManager.isInCall) videoCallManager.endCall();
    if (socket) socket.disconnect();
    localStorage.clear();
    window.location.href = 'InicioS.html';
}

function iniciales(nombre) {
    return nombre.split(' ').slice(0, 2).map(n => n[0]).join('').toUpperCase();
}

function escapeHtml(str) {
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function formatHora(ts) {
    if (!ts) return '';
    return new Date(ts).toLocaleTimeString('es-MX', { hour: '2-digit', minute: '2-digit' });
}

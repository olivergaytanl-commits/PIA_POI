<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Raleway&display=swap" rel="stylesheet">
  <title>Tienda - BetGol</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: 'Raleway', sans-serif; background-color: #EDFFE4; margin: 0; }

    .navbar {
      display: flex; justify-content: space-between; align-items: center;
      padding: 15px 30px; background-color: #446447;
    }
    .nav-left { text-decoration: none; color: white; font-weight: bold; }
    .nav-right { display: flex; align-items: center; gap: 10px; }
    #navNombre { color: white; font-weight: bold; }
    hr { margin: 0; }

    .layout { display: flex; }

    .sidebar {
      width: 250px; min-height: 92.2vh; background-color: #72A877;
      color: white; padding: 20px; flex-shrink: 0;
    }
    .sidebar ul { list-style: none; padding: 0; }
    .sidebar li { padding: 10px 0; cursor: pointer; }
    .sidebar li:hover { background-color: #869181; }
    .sidebar a { text-decoration: none; color: white; display: block; padding: 10px; }

    .contenido { flex: 1; padding: 30px; }

    .tienda-header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 24px; flex-wrap: wrap; gap: 12px;
    }
    .tienda-header h1 { font-size: 1.8rem; color: #2d4a2f; margin: 0; }
    .monedas-badge {
      background: #446447; color: white; padding: 8px 18px;
      border-radius: 20px; font-weight: bold; font-size: 1rem;
      display: flex; align-items: center; gap: 6px;
    }

    .btn-agregar-cosmetico {
      background: #72A877; color: white; border: none;
      padding: 10px 20px; border-radius: 8px; font-family: 'Raleway', sans-serif;
      font-size: 0.9rem; cursor: pointer; display: flex; align-items: center; gap: 8px;
      transition: background 0.2s;
    }
    .btn-agregar-cosmetico:hover { background: #446447; }

    .seccion-titulo {
      font-size: 1.1rem; color: #2d4a2f; font-weight: bold;
      margin-bottom: 16px; padding-bottom: 8px;
      border-bottom: 2px solid #72A877;
    }

    .banners-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px; margin-bottom: 40px;
    }

    .banner-card {
      background: white; border-radius: 12px;
      border: 1px solid #c8e6c9; overflow: hidden;
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .banner-card:hover { transform: translateY(-3px); box-shadow: 0 6px 20px rgba(68,100,71,0.15); }
    .banner-card.equipada { border: 2px solid #446447; }

    .banner-preview {
      width: 100%; height: 120px; object-fit: cover; display: block;
    }
    .banner-preview-placeholder {
      width: 100%; height: 120px; background: #a8d5a2;
      display: flex; align-items: center; justify-content: center;
      font-size: 2rem; color: white;
    }

    .banner-info { padding: 14px 16px; }
    .banner-nombre { font-weight: bold; font-size: 0.95rem; color: #2d4a2f; margin-bottom: 4px; }
    .banner-desc { font-size: 0.8rem; color: #666; margin-bottom: 12px; line-height: 1.4; }

    .banner-footer { display: flex; justify-content: space-between; align-items: center; }
    .banner-precio {
      font-weight: bold; color: #446447; font-size: 1rem;
      display: flex; align-items: center; gap: 4px;
    }
    .btn-comprar {
      background: #446447; color: white; border: none;
      padding: 7px 16px; border-radius: 6px; font-family: 'Raleway', sans-serif;
      font-size: 0.82rem; cursor: pointer; transition: background 0.2s;
    }
    .btn-comprar:hover:not(:disabled) { background: #2d4a2f; }
    .btn-comprar:disabled { background: #aaa; cursor: default; }
    .btn-comprar.equipar { background: #72A877; }
    .btn-comprar.equipar:hover { background: #446447; }
    .badge-equipado {
      background: #d4edda; color: #155724; font-size: 0.72rem;
      padding: 3px 8px; border-radius: 10px; font-weight: bold;
    }

    /* Banner equipado activo */
    .mi-banner-preview {
      background: white; border-radius: 12px; padding: 16px;
      margin-bottom: 30px; border: 1px solid #c8e6c9;
    }
    .mi-banner-preview .label { font-size: 0.8rem; color: #888; margin-bottom: 8px; }
    .banner-equipado-img {
      width: 100%; max-width: 500px; height: 110px;
      object-fit: cover; border-radius: 8px; display: block;
    }
    .banner-equipado-placeholder {
      width: 100%; max-width: 500px; height: 110px;
      background: #e8f5e9; border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      color: #888; font-size: 0.85rem; border: 2px dashed #c8e6c9;
    }

    /* Modal */
    .modal-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.5); z-index: 1000;
      align-items: center; justify-content: center;
    }
    .modal-overlay.visible { display: flex; }
    .modal-box {
      background: white; border-radius: 14px; padding: 28px;
      width: 480px; max-width: 95vw; position: relative;
    }
    .modal-box h2 { font-size: 1.2rem; color: #2d4a2f; margin-bottom: 20px; }
    .modal-close {
      position: absolute; top: 16px; right: 16px;
      background: none; border: none; font-size: 1.4rem; cursor: pointer; color: #888;
    }
    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; font-size: 0.85rem; color: #444; margin-bottom: 6px; font-weight: bold; }
    .form-group input, .form-group textarea {
      width: 100%; padding: 9px 12px; border: 1px solid #c8e6c9;
      border-radius: 8px; font-family: 'Raleway', sans-serif;
      font-size: 0.9rem; outline: none; transition: border 0.2s;
    }
    .form-group input:focus, .form-group textarea:focus { border-color: #72A877; }
    .form-group textarea { resize: vertical; min-height: 70px; }
    .url-preview-img {
      width: 100%; height: 100px; object-fit: cover;
      border-radius: 8px; margin-top: 8px;
      border: 1px solid #c8e6c9; display: none;
    }
    .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; }
    .btn-cancel {
      background: none; border: 1px solid #ccc; padding: 8px 20px;
      border-radius: 8px; cursor: pointer; font-family: 'Raleway', sans-serif;
    }
    .btn-guardar {
      background: #446447; color: white; border: none;
      padding: 8px 20px; border-radius: 8px; cursor: pointer;
      font-family: 'Raleway', sans-serif; font-weight: bold;
    }
    .btn-guardar:hover { background: #2d4a2f; }

    /* Toast */
    .toast-notif {
      position: fixed; bottom: 28px; right: 28px;
      background: #2d4a2f; color: white;
      padding: 12px 22px; border-radius: 10px;
      font-size: 0.9rem; z-index: 9999;
      opacity: 0; transform: translateY(10px);
      transition: opacity 0.3s, transform 0.3s; pointer-events: none;
    }
    .toast-notif.show { opacity: 1; transform: translateY(0); }

    .loading-msg { color: #888; font-size: 0.9rem; }
    .error-msg { color: #c0392b; font-size: 0.9rem; }
  </style>
</head>
<body>

<nav class="navbar">
  <a href="Inicio.html" class="nav-left">BetGol ⚽</a>
  <div class="nav-right">
    <img id="navAvatar" src="perfil.jpg"
         style="width:35px;height:35px;border-radius:50%;object-fit:cover;">
    <span id="navNombre"></span>
  </div>
</nav>
<hr>

<div class="layout">

  <aside class="sidebar">
    <h2>Servicios en línea:</h2>
    <ul>
      <li><a href="Publi.html">Crear publicación</a></li>
      <li><a href="Chat.html">Chats</a></li>
      <li><a href="Tarea.html">Tareas</a></li>
      <li><a href="Perfil.html">Perfil</a></li>
      <li><a href="Tienda.html">Tienda</a></li>
      <li><a href="Ayuda.html">Ayuda</a></li>
      <hr>
      <li id="li-login"><a href="InicioS.html">Iniciar sesión</a></li>
      <li id="li-logout"><a onclick="logout()" style="cursor:pointer;">Cerrar sesión</a></li>
    </ul>
  </aside>

  <div class="contenido">

    <div class="tienda-header">
      <div style="display:flex;align-items:center;gap:16px;flex-wrap:wrap;">
        <h1>🛍️ Tienda</h1>
        <div class="monedas-badge">🪙 <span id="totalMonedas">0</span> monedas</div>
      </div>
      <button class="btn-agregar-cosmetico" onclick="abrirModal()">
        ➕ Agregar cosmético
      </button>
    </div>

    <!-- Banner equipado actualmente -->
    <div class="mi-banner-preview">
      <div class="label">Tu banner actual</div>
      <div id="bannerActualDisplay" class="banner-equipado-placeholder">
        Ningún banner equipado
      </div>
    </div>

    <!-- Catálogo -->
    <div class="seccion-titulo">🖼️ Banners de perfil</div>
    <div class="banners-grid" id="bannersGrid">
      <p class="loading-msg">Cargando catálogo...</p>
    </div>

  </div>
</div>

<!-- Modal agregar cosmético -->
<div class="modal-overlay" id="modalAgregar">
  <div class="modal-box">
    <button class="modal-close" onclick="cerrarModal()">✕</button>
    <h2>➕ Agregar nuevo cosmético</h2>

    <div class="form-group">
      <label>Nombre del banner</label>
      <input type="text" id="inputNombre" placeholder="Ej: Banner Noche Estrellada">
    </div>
    <div class="form-group">
      <label>Descripción</label>
      <textarea id="inputDesc" placeholder="Describe este cosmético..."></textarea>
    </div>
    <div class="form-group">
      <label>URL de la imagen (rectangular, relación 4:1 aprox.)</label>
      <input type="url" id="inputUrl" placeholder="https://..." oninput="previewUrl()">
      <img id="urlPreview" class="url-preview-img" alt="Vista previa">
    </div>
    <div class="form-group">
      <label>Precio (monedas)</label>
      <input type="number" id="inputPrecio" placeholder="100" min="0">
    </div>

    <div class="modal-actions">
      <button class="btn-cancel" onclick="cerrarModal()">Cancelar</button>
      <button class="btn-guardar" onclick="guardarCosmetico()">Guardar</button>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="toast-notif" id="toastNotif"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
const token       = localStorage.getItem('token');
const currentUser = JSON.parse(localStorage.getItem('user') || 'null');

/* ── Navbar ── */
if (currentUser) {
  document.getElementById('navNombre').textContent = currentUser.full_name || '';
  if (currentUser.img_profile)
    document.getElementById('navAvatar').src = currentUser.img_profile;
}
function logout() {
    const t = localStorage.getItem('token');
    if (t) fetch('/api/logout', { method:'POST', headers:{'Authorization':'Bearer '+t} }).catch(()=>{});
    localStorage.clear();
    window.location.href = 'InicioS.html';
}

    // Control sidebar sesión
    (function() {
        const liLogin  = document.getElementById('li-login');
        const liLogout = document.getElementById('li-logout');
        if (localStorage.getItem('token')) {
            if (liLogin)  liLogin.style.display  = 'none';
            if (liLogout) liLogout.style.display = '';
        } else {
            if (liLogout) liLogout.style.display = 'none';
        }
    })();


function authFetch(url, opts = {}) {
  return fetch(url, {
    ...opts,
    headers: { ...(opts.headers || {}), 'Authorization': `Bearer ${token}` }
  });
}

/* ── Toast ── */
function toast(msg, ok = true) {
  const el = document.getElementById('toastNotif');
  el.textContent = msg;
  el.style.background = ok ? '#2d4a2f' : '#8b2929';
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 3200);
}

/* ── Cargar catálogo desde el servidor ── */
async function cargarTienda() {
  const grid = document.getElementById('bannersGrid');
  grid.innerHTML = '<p class="loading-msg">Cargando catálogo...</p>';

  try {
    const res  = await authFetch('/api/tienda/cosmeticos');
    if (!res.ok) throw new Error('Error al cargar');
    const data = await res.json();

    // Mostrar monedas
    const mRes = await authFetch('/api/usuarios/monedas');
    const mData = await mRes.json();
    document.getElementById('totalMonedas').textContent = mData.monedas ?? 0;

    // Mostrar banner equipado
    if (data.banner_url) {
      document.getElementById('bannerActualDisplay').innerHTML =
        `<img src="${data.banner_url}" class="banner-equipado-img" alt="Banner equipado">`;
    }

    renderCatalogo(data.cosmeticos);
  } catch (err) {
    grid.innerHTML = '<p class="error-msg">No se pudo cargar la tienda. Asegúrate de haber iniciado sesión.</p>';
  }
}

/* ── Renderizar tarjetas ── */
function renderCatalogo(lista) {
  const grid = document.getElementById('bannersGrid');
  grid.innerHTML = '';

  if (!lista || !lista.length) {
    grid.innerHTML = '<p class="loading-msg">No hay cosméticos disponibles aún.</p>';
    return;
  }

  lista.forEach(c => {
    const card = document.createElement('div');
    card.className = 'banner-card' + (c.equipado ? ' equipada' : '');

    let accionBtn = '';
    if (c.tengo) {
      if (c.equipado) {
        accionBtn = `<button class="btn-comprar" disabled>✓ Equipado</button>`;
      } else {
        accionBtn = `<button class="btn-comprar equipar" onclick="equiparBanner(${c.id}, this)">Equipar</button>`;
      }
    } else {
      accionBtn = `<button class="btn-comprar" onclick="comprarBanner(${c.id}, this)">Comprar</button>`;
    }

    card.innerHTML = `
      ${c.img_url
        ? `<img class="banner-preview" src="${c.img_url}" alt="${c.nombre}"
               onerror="this.parentElement.querySelector('.banner-preview-placeholder').style.display='flex'; this.style.display='none';">
           <div class="banner-preview-placeholder" style="display:none;">🖼️</div>`
        : `<div class="banner-preview-placeholder">🖼️</div>`
      }
      <div class="banner-info">
        <div class="banner-nombre">${c.nombre}</div>
        <div class="banner-desc">${c.descripcion || ''}</div>
        <div class="banner-footer">
          <div class="banner-precio">🪙 ${c.precio}</div>
          <div style="display:flex;align-items:center;gap:8px;">
            ${c.equipado ? '<span class="badge-equipado">✓ Equipado</span>' : ''}
            ${accionBtn}
          </div>
        </div>
      </div>
    `;
    grid.appendChild(card);
  });
}

/* ── Comprar ── */
async function comprarBanner(id, btn) {
  btn.disabled = true;
  btn.textContent = 'Comprando...';

  try {
    const res  = await authFetch('/api/tienda/comprar', {
      method:  'POST',
      headers: { 'Content-Type': 'application/json' },
      body:    JSON.stringify({ cosmetico_id: id })
    });
    const data = await res.json();

    if (!res.ok) {
      toast(data.error || 'No se pudo comprar', false);
      btn.disabled = false;
      btn.textContent = 'Comprar';
      return;
    }

    document.getElementById('totalMonedas').textContent = data.monedas_restantes;
    toast('¡Compra exitosa! Ya puedes equiparlo 🎉');
    cargarTienda();
  } catch {
    toast('Error de red al comprar', false);
    btn.disabled = false;
    btn.textContent = 'Comprar';
  }
}

/* ── Equipar ── */
async function equiparBanner(id, btn) {
  btn.disabled = true;
  btn.textContent = 'Equipando...';

  try {
    const res  = await authFetch('/api/tienda/equipar', {
      method:  'POST',
      headers: { 'Content-Type': 'application/json' },
      body:    JSON.stringify({ cosmetico_id: id })
    });
    const data = await res.json();

    if (!res.ok) {
      toast(data.error || 'No se pudo equipar', false);
      btn.disabled = false;
      btn.textContent = 'Equipar';
      return;
    }

    // Actualizar banner_url en localStorage para que se vea en otras páginas
    if (data.banner_url && currentUser) {
      currentUser.banner_url = data.banner_url;
      localStorage.setItem('user', JSON.stringify(currentUser));
      localStorage.setItem('bannerEquipado', data.banner_url);
    }

    toast('Banner equipado. ¡Se verá en tu perfil! ✨');
    cargarTienda();
  } catch {
    toast('Error de red al equipar', false);
    btn.disabled = false;
    btn.textContent = 'Equipar';
  }
}

/* ── Modal agregar ── */
function abrirModal()  { document.getElementById('modalAgregar').classList.add('visible'); }
function cerrarModal() {
  document.getElementById('modalAgregar').classList.remove('visible');
  ['inputNombre','inputDesc','inputUrl','inputPrecio'].forEach(id => {
    document.getElementById(id).value = '';
  });
  document.getElementById('urlPreview').style.display = 'none';
}
function previewUrl() {
  const url = document.getElementById('inputUrl').value;
  const img = document.getElementById('urlPreview');
  img.style.display = url ? 'block' : 'none';
  if (url) img.src = url;
}
document.getElementById('modalAgregar').addEventListener('click', e => {
  if (e.target === document.getElementById('modalAgregar')) cerrarModal();
});

async function guardarCosmetico() {
  const nombre = document.getElementById('inputNombre').value.trim();
  const desc   = document.getElementById('inputDesc').value.trim();
  const url    = document.getElementById('inputUrl').value.trim();
  const precio = parseInt(document.getElementById('inputPrecio').value) || 0;

  if (!nombre) { toast('El nombre es obligatorio.', false); return; }
  if (!url)    { toast('La URL de imagen es obligatoria.', false); return; }

  try {
    const res  = await authFetch('/api/tienda/cosmeticos', {
      method:  'POST',
      headers: { 'Content-Type': 'application/json' },
      body:    JSON.stringify({ nombre, descripcion: desc, img_url: url, precio, tipo: 'banner' })
    });
    const data = await res.json();

    if (!res.ok) { toast(data.error || 'Error al guardar', false); return; }

    cerrarModal();
    toast('¡Cosmético agregado! 🛍️');
    cargarTienda();
  } catch {
    toast('Error de red al guardar', false);
  }
}

/* ── Iniciar ── */
cargarTienda();
</script>
</body>
</html>

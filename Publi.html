<h3>Crear publicación</h3>

<label>Título de la publicación</label>

<label>Multimedia (opcional)</label>

<script>

  const SUPABASE_URL  = 'https://fjoiyxvhbntpcxjrrksy.supabase.co';
  const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZqb2l5eHZoYm50cGN4anJya3N5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY1MzI5NTAsImV4cCI6MjA5MjEwODk1MH0.wdqCJyqzMCiHpET3Y91PIerTwqK-u9D0jAkrtjY46zc';

  const sbClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

  const token = localStorage.getItem('token');

  function authFetch(url, opts = {}) {
    return fetch(url, {
        ...opts,
        headers: { ...(opts.headers || {}), 'Authorization': `Bearer ${token}` }
    });
}

async function publicar() {
    const titulo    = document.getElementById('titulo').value.trim();
    const datos     = document.getElementById('datos').value.trim();
    const categoria = document.getElementById('categoria').value;
    const fileInput = document.getElementById('media');
    const archivo   = fileInput.files[0];

    if (!titulo || !datos || !categoria)
        return alert('⚠️ Completa todos los campos');

    let media_url = null;

    if (archivo) {
        const nombreArchivo = `${Date.now()}_${archivo.name}`;

        const { data, error } = await sbClient
            .storage
            .from('media')
            .upload(nombreArchivo, archivo);

        if (error) return alert('Error al subir archivo: ' + error.message);

        const { data: urlData } = sbClient
            .storage
            .from('media')
            .getPublicUrl(nombreArchivo);

        media_url = urlData.publicUrl;
    }

    const res = await authFetch('/api/publicaciones', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ titulo, datos, categoria, media_url })
    });

    if (res.ok) {
        alert('✅ Publicación creada');
        // ── Logro: Influencer (≥ 3 publicaciones) ──
        desbloquearLogro('influencer');
    } else {
        const d = await res.json();
        alert(d.error || 'Error al publicar');
    }
}

</script>


<script>
// ── Sidebar: sesión ───────────────────────────────────────
document.addEventListener('DOMContentLoaded', function() {
    const token = localStorage.getItem('token');
    const liLogin  = document.getElementById('li-login');
    const liLogout = document.getElementById('li-logout');
    if (token) {
        if (liLogin)  liLogin.style.display  = 'none';
        if (liLogout) liLogout.style.display = '';
    } else {
        if (liLogout) liLogout.style.display = 'none';
    }
});

function logout() {
    const token = localStorage.getItem('token');
    if (token) {
        fetch('/api/logout', {
            method: 'POST',
            headers: { 'Authorization': 'Bearer ' + token }
        }).catch(() => {});
    }
    localStorage.clear();
    window.location.href = 'InicioS.html';
}
</script>
